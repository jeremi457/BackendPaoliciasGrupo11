server:
  port: 8084
  address: 0.0.0.0
  error:
    include-message: always

spring:
  application:
    name: pagos-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/pagos_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    secret: ${JWT_SECRET}
  internal-key: ${INTERNAL_KEY}
  reservas:
    url: ${RESERVAS_URL:https://reservas-service-5syk.onrender.com}