services:
  db:
    image: postgres:18-alpine
    container_name: paolicias_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paolicias
    ports:
      - "5434:5432"
    volumes:
      - paolicias_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d paolicias"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    container_name: auth_service
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/auth_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE}
    ports:
      - "8081:8081"

  catalogo-service:
    build: ./catalogo-service
    container_name: catalogo_service
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/catalogo_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"

  reservas-service:
    build: ./reservas-service
    container_name: reservas_service
    depends_on:
      db:
        condition: service_healthy
      catalogo-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/reservas_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      CATALOGO_URL: http://catalogo-service:8082
    ports:
      - "8083:8083"

  pagos-service:
    build: ./pagos-service
    container_name: pagos_service
    depends_on:
      db:
        condition: service_healthy
      reservas-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/pagos_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_KEY: ${INTERNAL_KEY}
      RESERVAS_URL: http://reservas-service:8083
    ports:
      - "8084:8084"

volumes:
  paolicias_data: