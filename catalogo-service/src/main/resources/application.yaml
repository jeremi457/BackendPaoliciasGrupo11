server:
    port: 8082
    address: 0.0.0.0
    error:
      include-message: always
spring:
    application:
      name: catalogo-service
    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5434/catalogo_db}
      username: ${DB_USER:paolicias}
      password: ${DB_PASSWORD:cambiar_esta_clave}
    jpa:
      hibernate:
        ddl-auto: update
      open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET}