server:
    port: 8082
    address: 0.0.0.0
    error:
      include-message: always
spring:
    application:
      name: catalogo-service
    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5434/catalogo_db}
      username: ${DB_USER}
      password: ${DB_PASSWORD}
    jpa:
      hibernate:
        ddl-auto: update
      open-in-view: false
    servlet:
      multipart:
        max-file-size: 5MB
        max-request-size: 6MB
app:
  jwt:
    secret: ${JWT_SECRET}