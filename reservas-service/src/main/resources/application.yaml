server:
  port: 8083
  address: 0.0.0.0
  error:
    include-message: always

spring:
  application:
    name: reservas-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/reservas_db}
    username: ${DB_USER:paolicias}
    password: ${DB_PASSWORD:cambiar_esta_clave}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
  internal-key: ${INTERNAL_KEY}
  catalogo:
    url: ${CATALOGO_URL:http://localhost:8082}