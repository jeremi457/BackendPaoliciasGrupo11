server:
  port: 8081
  address: 0.0.0.0
  error:
    include-message: always

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/auth_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: ${JWT_EXP_MIN:480}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    nombre: ${ADMIN_NOMBRE:Administrador}
