version: '3.8'

services:
  db-auth:
    image: postgres:15-alpine
    container_name: postgres_db_auth
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: db_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  auth-service:
    build: .
    container_name: container_auth_service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db-auth
      DB_PORT: 5432
      DB_NAME: db_auth
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      - db-auth

volumes:
  postgres_auth_data: